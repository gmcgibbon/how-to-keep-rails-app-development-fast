            ## Profiling

            ```sh
            > bundle add stackprof --group development
            ```
            ```rb
            # config/boot.rb

            if (mode = ENV["STACKPROF_MODE"])
              interval = ENV.fetch("STACKPROF_INTERVAL", 1000)
              require "stackprof"
              StackProf.start(mode: mode.to_sym, raw: true, interval: interval.to_i)

              at_exit do
                StackProf.stop
                data = StackProf.results
                File.write("tmp/stackprof-boot.json", JSON.generate(data))
              end
            end
            ```
            ```sh
            > STACKPROF_MODE=wall bin/rails boot
            ```

            Note:
            - We instrument our app with a profiler
            - In this case stackprof
            - We can add that to our project with bundle add
            - Then we add some code to config/boot
            - Then we boot the app with a special environment variable

            ## Watching less files

            ```rb
            # activesupport/lib/i18n_railtie.rb

            reloader = file_watcher.new(root_load_paths, directories) do
              # delete old ones
              I18n.load_path.delete_if do |path|
                path.to_s.start_with?(Rails.root) && !File.exist?(path)
              end

              # add new ones
              I18n.load_path |= reloadable_paths.flat_map(&:existent)
            end
            ```

            - We don't execute the watcher immediately

            Note:

            - We reduced allocations during tokenization
            ---
            ## Journey parsing

            ```rb
            module ActionDispatch
              module Journey
                class Scanner
                  def scan # eg. /some/path/:param(.:format)
                    next_byte = @scanner.peek_byte
                    if (token = STATIC_TOKENS[next_byte])
                      @scanner.pos += 1
                      @length = @scanner.skip(/\w+/).to_i + 1
                      token
                    else
                      # ...
                    end
                  end
                end
              end
            end
            ```

            Note:
            - This is a simplified version of the scanner optimization
            - Peeking bytes and using static tokens reduced allocations
            - And made journey parsing ~10% faster for free
            - The code is also more optimizable with YJIT

            ## Restricting boot-time network IO

            ```rb
            # lib/patches/net_http.rb

            class RestrictedTCPSocket < TCPSocket
              class << self
                attr_accessor :ready

                def open(...)
                  raise "Not ready yet" unless ready
                  super
                end
              end

              self.ready = false
            end
            Net::HTTP::TCPSocket = RestrictedTCPSocket
            ```

            Note:
            - We also banned network requests on boot
            - This code snippet allows you to do just that

            Note:

            ---
            ## Restricting boot-time network IO

            ```rb[5-10]
            # lib/patches/net_http.rb

            class RestrictedTCPSocket < TCPSocket
              class << self
                attr_accessor :ready

                def open(...)
                  raise "Not ready yet" unless ready
                  super
                end
              end

              self.ready = false
            end
            Net::HTTP::TCPSocket = RestrictedTCPSocket
            ```

            Note:
            - Inside of the subclass, we define a ready accessor
            - Ready is set to false by default
            - We override open and raise when we open a socket and aren't ready
            ---
            ## Restricting boot-time network IO

            ```rb
            # config/application.rb

            module Some
              class Application < Rails::Application
                config.after_initialize do
                  RestrictedTCPSocket.ready = true
                end
              end
            end
            ```

            Note:
            - We can then make an after_initialize hook that readies the socket
            - This way, all network traffic will fail unless the app has been initialized
